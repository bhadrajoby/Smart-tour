{% extends 'agency/agency_home.html' %}
{% block body %}

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<style>
body{
font-family:'DM Sans',sans-serif;
}

/* Background */
.page-wrapper{
padding:2rem;
background: linear-gradient(135deg,#f5f9ff 0%,#e8f0fd 100%);
min-height:100vh;
}

/* Glass Card */
.glass-card{
background:white;
border-radius:25px;
padding:35px;
box-shadow:0 25px 45px -15px rgba(0,0,0,0.15);
max-width: 600px;
margin: auto;
}

/* Header */
.page-header{
display:flex;
align-items:center;
gap:12px;
margin-bottom:30px;
}

.page-header i{
font-size:30px;
color:#1e3a5f;
}

.page-header h2{
font-weight:600;
border-bottom:3px solid #1e3a5f;
padding-bottom:6px;
margin:0;
}

/* Labels */
.form-label{
font-weight:600;
color:#1e3a5f;
font-size:14px;
}

/* Inputs */
.form-control{
border:2px solid #eef2f6;
border-radius:14px;
padding:12px 18px;
font-size:14px;
transition:0.3s;
background:#f8fbff;
}

.form-control:focus{
border-color:#1e3a5f;
box-shadow:0 0 0 3px rgba(30,58,95,0.1);
background:white;
}

/* Password box */
.password-requirements{
background:#f8fbff;
border-radius:12px;
padding:12px;
margin-top:10px;
border-left:3px solid #1e3a5f;
font-size:13px;
color:#64748b;
}

/* Match message */
.match-message{
font-size:13px;
margin-top:8px;
padding:8px;
border-radius:8px;
display:none;
}

.match-message.success{
background:#e6f7e6;
color:#28a745;
}

.match-message.error{
background:#ffe6e6;
color:#dc3545;
}

/* Button */
.btn-theme{
background:#1e3a5f;
color:white;
border:none;
border-radius:12px;
padding:12px;
font-weight:600;
transition:0.3s;
box-shadow:0 8px 16px -5px rgba(30,58,95,0.3);
}

.btn-theme:hover{
background:#2a4a7a;
transform:translateY(-2px);
color:white;
}

</style>

<div class="page-wrapper">

<div class="glass-card">

<!-- Header -->
<div class="page-header">
<i class="bi bi-shield-lock-fill"></i>
<h2>Change Password</h2>
</div>

<form method="post" id="passwordForm">
{% csrf_token %}

<div class="mb-4">
<label class="form-label"><i class="bi bi-key-fill"></i> Current Password</label>
<input type="password" name="old" class="form-control" id="oldPassword" required>
</div>

<div class="mb-4">
<label class="form-label"><i class="bi bi-lock-fill"></i> New Password</label>
<input type="password" name="new" class="form-control" id="newPassword" required>

<div class="password-requirements">
✔ Minimum 6 characters <br>
✔ Use letters & numbers
</div>
</div>

<div class="mb-4">
<label class="form-label"><i class="bi bi-lock-fill"></i> Confirm Password</label>
<input type="password" name="new1" class="form-control" id="confirmPassword" required>

<div id="matchMessage" class="match-message"></div>
</div>

<button type="submit" class="btn-theme w-100" id="submitBtn">
Update Password
</button>

</form>

</div>

</div>

<script>
const newPass = document.getElementById("newPassword");
const confirmPass = document.getElementById("confirmPassword");
const msg = document.getElementById("matchMessage");

function checkMatch(){
if(confirmPass.value === "") return;

if(newPass.value === confirmPass.value){
msg.style.display="block";
msg.className="match-message success";
msg.innerHTML="✔ Passwords match";
}else{
msg.style.display="block";
msg.className="match-message error";
msg.innerHTML="✖ Passwords do not match";
}
}

newPass.addEventListener("keyup",checkMatch);
confirmPass.addEventListener("keyup",checkMatch);

document.getElementById("passwordForm").addEventListener("submit",function(e){
if(newPass.value !== confirmPass.value){
e.preventDefault();
msg.style.display="block";
msg.className="match-message error";
msg.innerHTML="✖ Passwords do not match!";
}
});
</script>

{% endblock %}
