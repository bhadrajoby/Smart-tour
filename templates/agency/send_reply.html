{% extends 'agency/agency_home.html' %}
{% block body %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Send Reply</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
  <div class="container">
    <h2 class="mb-4">Send Reply</h2>
    <form method="post" action="/myapp/send_reply_post/">{% csrf_token %}
      <div class="row mb-3">
        <label for="name" class="col-sm-4 ">Enter the Reply:</label>
        <div class="col-sm-8">
          <input type="text" class="form-control" id="name" name="reply" required>
        </div>
      </div>



      <div class="row mb-3">
        <div class="offset-sm-4 col-sm-8">
          <button type="submit" class="btn btn-primary">Send</button>
        </div>
      </div>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
{% endblock %}
