<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>Assign Guide · Smart Tour</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<style>

body{
font-family:'DM Sans',sans-serif;
background:linear-gradient(135deg,#f5f9ff 0%,#e8f0fd 100%);
min-height:100vh;
padding:2rem;
}

.assign-wrapper{
max-width:600px;
margin:auto;
}

.glass-card{
background:white;
border-radius:30px;
padding:40px;
box-shadow:0 30px 45px -20px #0a1929;
}

.page-header{
display:flex;
align-items:center;
gap:12px;
margin-bottom:25px;
}

.page-header i{
font-size:32px;
color:#1e3a5f;
}

.page-header h2{
font-weight:600;
border-bottom:3px solid #1e3a5f;
padding-bottom:5px;
margin:0;
}

.form-label{
font-weight:600;
margin-bottom:8px;
}

.form-select{
border-radius:16px;
border:2px solid #e2e8f0;
padding:10px;
font-size:15px;
}

.form-select:focus{
border-color:#1e3a5f;
box-shadow:0 0 0 3px rgba(30,58,95,.15);
}

.btn-submit{
background:linear-gradient(135deg,#0a1929,#1e3a5f);
color:white;
border:none;
padding:12px;
border-radius:40px;
width:100%;
font-weight:600;
margin-top:20px;
}

.btn-submit:hover{
background:linear-gradient(135deg,#1e3a5f,#2c4c6e);
}

</style>

</head>

<body>

<div class="assign-wrapper">

<div class="glass-card">

<div class="page-header">
<i class="bi bi-person-check-fill"></i>
<h2>Assign Guide</h2>
</div>

<form action="/myapp/assign_guide_post/{{ data.id }}" method="post">

{% csrf_token %}

<div class="mb-3">

<label class="form-label">
<i class="bi bi-person"></i> Select Guide
</label>

<select name="guide" class="form-select" required>

<option value="">-- Choose Guide --</option>

{% for i in data1 %}

<option value="{{ i.id }}">{{ i.name }}</option>
{% endfor %}

</select>

</div>

<button type="submit" class="btn-submit">
<i class="bi bi-check-circle"></i> Assign Guide
</button>

</form>

</div>

</div>

</body>
</html>
