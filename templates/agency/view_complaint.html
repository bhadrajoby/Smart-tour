{% extends 'agency/agency_home.html' %}
{% block body %}



<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>View Complaint</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- DataTables CSS -->
  <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h2 class="mb-4">View Complaint</h2>
    <table id="registrationTable" class="table table-striped table-bordered">
      <thead>
        <tr>
        <th>Sl No</th>
        <th>User</th>
        <th>Agency</th>
        <th>Compliant</th>
        <th>Date</th>
        <th>Reply</th>
        </tr>
      </thead>
      <tbody>
        <!-- Sample Data Row -->
        {% for i in data %}
    <tr>
        <td>{{ forloop.counter }}</td>
        <td>{{ i.user.name }}</td>
        <td>{{ i.agency.name }}</td>
        <td>{{ i.compliant }}</td>
        <td>{{ i.date }}</td>
        <td>
            {{ i.reply }}
        <a href="/myapp/send_reply/{{ i.id }}">Reply</a>
        </td>
    </tr>
    {% endfor %}
        <!-- Add more rows dynamically from backend -->
      </tbody>
    </table>
  </div>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
  <script>
    $(document).ready(function () {
      $('#registrationTable').DataTable();
    });
  </script>
</body>
</html>
{% endblock %}
